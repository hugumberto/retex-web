name: Open PR main to dev

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure there is an open PR from main to dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list \
            --base dev \
            --head main \
            --state open \
            --json number \
            --jq 'length')

          if [ "$count" -gt 0 ]; then
            echo "Open PR from main to dev already exists."
            exit 0
          fi

          git fetch origin main dev

          if git diff --quiet origin/dev..origin/main; then
            echo "No diff between main and dev."
            exit 0
          fi

          gh pr create \
            --base dev \
            --head main \
            --title "Sync main into dev" \
            --body "PR criado automaticamente após merge de pull request na branch main."
